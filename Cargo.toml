[workspace]
resolver = "2"
members = ["crates/tkdata", "crates/tolkien", "crates/datagen"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["Lukasz Gryglicki"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
debug = false
